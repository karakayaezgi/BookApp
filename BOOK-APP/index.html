<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>B O O K</title>
</head>

<body class="bg-secondary-subtle">
    <div class="container bg-white p-3 rounded-3 my-3 sticky-top shadow navbar-sticky">
        <div class="row align-items-center">
            <button class="col-2 col-md-3 col-lg-3 bg-transparent border-0">
                <img class="img-fluid logo" src="images/BOOK.png" alt="">
            </button>
            <div class="col-10 col-md-9 col-lg-9">
                <div class="input-group">
                    <input type="text" class="search-input form-control rounded-start-5"
                        placeholder="Kitap adı, yazar ya da kategori arayınız...">
                    <button class="search-btn btn btn-outline-success rounded-end-5" type="button">
                        <i class="bi bi-search-heart fs-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="container bg-white p-3 my-3 rounded-3 shadow">
        <div
            class="row ms-1 me-1 py-3 ps-1 pe-1 shadow rounded-4 bg-warning-subtle position-sticky top-offset justify-content-between">
            <div class="col-4 col-lg-4 d-flex align-items-center gap-1">
                <i class="bi bi-clipboard2-plus text-warning fs-4"></i>
                <button class="border-0 bg-transparent" data-bs-toggle="modal"
                    data-bs-target="#addBookModal">Ekle</button>
            </div>
            <div class="col-4 col-lg-3 select">
                <select class="form-select sort" aria-label="Default select example">
                    <option selected>Sırala</option>
                    <option value="A-Z">A-Z</option>
                    <option value="Z-A">Z-A</option>
                </select>
            </div>
            <div class="col-4 col-lg-3 select">
                <select class="form-select form-control category" id="category" aria-label="Kategori" required
                    name="category">
                    <option selected>Lütfen kategori seçiniz.</option>
                    <option value="Bilim-Kurgu">Bilim Kurgu</option>
                    <option value="Aşk">Aşk</option>
                    <option value="Tarihi">Tarihi</option>
                    <option value="Roman">Roman</option>
                    <option value="Kişisel Gelişim">Kişisel Gelişim</option>
                    <option value="Bilim">Bilim</option>
                    <option value="Çocuk">Çocuk</option>
                </select>
            </div>
            <div class="col-2 col-lg-4 menu">
                <button class="border-0 bg-transparent" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu" aria-controls="mobileMenu">
                    <i class="bi bi-list fs-4"></i>
                </button>
            </div>

        </div>
        <div class="offcanvas offcanvas-end" data-bs-backdrop="static" tabindex="-1" id="mobileMenu"
            aria-labelledby="mobileMenuLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="mobileMenuLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="d-flex flex-column gap-2">
                    <select class="form-select sort" aria-label="Default select example">
                        <option selected>Sırala</option>
                        <option value="A-Z">A-Z</option>
                        <option value="Z-A">Z-A</option>
                    </select>
                    <select class="form-select form-control category" id="category" aria-label="Kategori" required
                        name="category">
                        <option selected>Lütfen kategori seçiniz.</option>
                        <option value="Bilim-Kurgu">Bilim Kurgu</option>
                        <option value="Aşk">Aşk</option>
                        <option value="Tarihi">Tarihi</option>
                        <option value="Roman">Roman</option>
                        <option value="Kişisel Gelişim">Kişisel Gelişim</option>
                        <option value="Bilim">Bilim</option>
                        <option value="Çocuk">Çocuk</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal fade" id="addBookModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
            aria-labelledby="addBookModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="addBookModalLabel">Kitap Ekle</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="form" class="modal-body">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="book-name" name="bookName"
                                placeholder="Kitap adı..." autocomplete="off" required>
                            <label for="book-name">Kitap adı</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="pageCount" name="pageCount" required
                                placeholder="Sayfa sayısı...">
                            <label for="pageCount">Sayfa sayısı</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="img-url" placeholder="Resim URL..."
                                name="imgUrl">
                            <label for="img-url">Resim URL</label>
                        </div>
                        <div class="form-floating mb-3">
                            <select class="form-select form-control" id="category" aria-label="Kategori" required
                                name="category">
                                <option selected>Lütfen kategori seçiniz.</option>
                                <option value="Bilim-Kurgu">Bilim Kurgu</option>
                                <option value="Aşk">Aşk</option>
                                <option value="Tarihi">Tarihi</option>
                                <option value="Roman">Roman</option>
                                <option value="Kişisel Gelişim">Kişisel Gelişim</option>
                                <option value="Bilim">Bilim</option>
                                <option value="Çocuk">Çocuk</option>
                            </select>
                            <label for="category">Kategori</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="author" placeholder="Yazar..." name="author"
                                required>
                            <label for="author">Yazar</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" placeholder="Kitabın konusu..." id="subject" name="subject"
                                required style="height: 100px"></textarea>
                            <label for="subject">Kitabın konusu</label>
                        </div>
                        <div class="modal-footer mb-3">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Kapat</button>
                            <button type="submit" class="btn btn-outline-success addOrUpdateBtn">Kaydet</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        <div class="row py-5 books-area">




        </div>
    </div>



















    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
